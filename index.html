<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terapeak URL ビルダー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e42;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --text: #e2e2f0;
      --text-muted: #8b8ba8;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 130px;
    }

    .app-header { text-align: center; margin-bottom: 20px; }
    .app-header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 3px; }
    .app-header p  { font-size: 0.82rem; color: var(--text-muted); }

    .container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent-hover);
      margin-bottom: 14px;
    }

    /* ── Grid helpers ── */
    .g2 { display: grid; grid-template-columns: 1fr 1fr;             gap: 10px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr;         gap: 10px; }
    .g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;     gap: 10px; }

    /* ── Form fields ── */
    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    input[type="text"],
    input[type="number"],
    input[type="date"],
    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }
    .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

    /* ── Tag input ── */
    .tag-input-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 8px;
      min-height: 38px;
      cursor: text;
      transition: border-color 0.15s;
    }
    .tag-input-wrap:focus-within { border-color: var(--accent); }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--accent);
      color: #fff;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .tag.exclude { background: #e11d48; }
    .tag button {
      background: none; border: none; color: rgba(255,255,255,0.8);
      cursor: pointer; font-size: 0.9rem; padding: 0; line-height: 1;
    }
    .tag button:hover { color: #fff; }
    .tag-input {
      background: none; border: none; color: var(--text);
      font-size: 0.88rem; outline: none; min-width: 80px; flex: 1;
    }

    /* ── Period row ── */
    .period-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .period-section {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .period-section.show { display: flex; }
    .period-section input[type="number"] { width: 72px; }
    .period-section input[type="date"]   { width: 140px; }
    .period-lbl { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }

    /* ── Toggle radio buttons ── */
    .radio-group { display: flex; gap: 6px; }
    .radio-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .radio-btn input { display: none; }
    .radio-btn.active {
      border-color: var(--accent);
      background: rgba(99,102,241,0.12);
      color: var(--accent-hover);
    }

    /* ── Section divider ── */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* ── Condition checkboxes ── */
    .field-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 7px;
    }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .cond-item {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center;
      gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      user-select: none;
    }
    .cond-item:has(input:checked) {
      border-color: var(--accent);
      color: var(--accent-hover);
      background: rgba(99,102,241,0.1);
    }
    .cond-item input[type="checkbox"] { width: auto; padding: 0; accent-color: var(--accent); }

    /* ── Advanced details ── */
    details.adv { margin-top: 14px; }
    details.adv summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }
    details.adv summary::before {
      content: '▶';
      font-size: 0.6rem;
      transition: transform 0.2s;
      display: inline-block;
    }
    details.adv[open] summary::before { transform: rotate(90deg); }
    details.adv .adv-body { padding-top: 12px; }

    /* ── Preset card ── */
    .preset-save-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .preset-save-row input { flex: 1; }
    .preset-list { display: flex; flex-direction: column; gap: 6px; }
    .preset-empty { color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 10px 0; }
    .preset-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: border-color 0.15s;
    }
    .preset-item:hover { border-color: var(--accent); }
    .preset-header { display: flex; align-items: center; gap: 7px; }
    .preset-num  { font-size: 0.7rem; color: var(--text-muted); min-width: 16px; }
    .preset-name { flex: 1; font-size: 0.87rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preset-date { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
    .preset-url-row { display: flex; align-items: center; gap: 6px; }
    .preset-url-text { flex: 1; font-size: 0.68rem; font-family: 'SF Mono','Fira Code',monospace; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preset-actions { display: flex; gap: 5px; }
    .preset-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.76rem;
      padding: 4px 10px;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .preset-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .preset-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .preset-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .preset-btn.del:hover { background: #e11d48; border-color: #e11d48; color: #fff; }

    /* ── Sticky URL bar ── */
    .url-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.35);
    }
    .url-bar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .url-display {
      flex: 1;
      min-width: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 0.72rem;
      font-family: 'SF Mono','Fira Code',monospace;
      color: #a5f3fc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }
    .url-btns { display: flex; gap: 7px; flex-shrink: 0; }
    .btn {
      padding: 8px 16px;
      border-radius: 7px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn-copy { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-open { background: #0ea5e9; color: #fff; }
    .copied   { background: var(--success) !important; }

    /* ── Misc ── */
    #dateRangeSection, #customDateSection { display: none; }
    #dateRangeSection.show, #customDateSection.show { display: flex; }

    @media (max-width: 600px) {
      .g2, .g3, .g4 { grid-template-columns: 1fr 1fr; }
      .url-bar-inner  { flex-direction: column; align-items: stretch; }
      .url-btns { justify-content: stretch; }
      .url-btns .btn { flex: 1; }
    }
    @media (max-width: 380px) {
      .g2, .g3, .g4 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app-header">
  <h1>Terapeak URL ビルダー</h1>
  <p>eBay リサーチ用クエリURLを簡単生成</p>
</div>

<div class="container">

  <!-- ① キーワード -->
  <div class="card">
    <div class="card-title">キーワード</div>
    <div class="g2">
      <label>
        含めるキーワード
        <input type="text" id="includeInput" placeholder='例: ヴィンテージ 時計' oninput="generateUrl()">
        <span class="hint">空のとき "" (全件) になります</span>
      </label>
      <label>
        除外キーワード
        <div class="tag-input-wrap" id="excludeWrap">
          <input class="tag-input" id="excludeInput" placeholder='Enter で追加（例: pokemon）'>
        </div>
      </label>
    </div>
  </div>

  <!-- ② 検索条件 -->
  <div class="card">
    <div class="card-title">検索条件</div>

    <!-- 期間 -->
    <div class="field-label">期間</div>
    <div class="period-row">
      <div class="radio-group">
        <label class="radio-btn active" id="modePreset">
          <input type="radio" name="dateMode" value="preset" checked> プリセット
        </label>
        <label class="radio-btn" id="modeCustom">
          <input type="radio" name="dateMode" value="custom"> 日付指定
        </label>
      </div>
      <div id="dateRangeSection" class="period-section show">
        <span class="period-lbl">過去</span>
        <input type="number" id="dayRange" value="7" min="1" max="365">
        <span class="period-lbl">日間</span>
      </div>
      <div id="customDateSection" class="period-section">
        <input type="date" id="startDate">
        <span class="period-lbl">〜</span>
        <input type="date" id="endDate">
      </div>
    </div>

    <div class="divider"></div>

    <!-- マーケット -->
    <div class="g4" style="margin-bottom:10px">
      <label>
        タブ
        <select id="tabName">
          <option value="SOLD">SOLD（売れた）</option>
          <option value="ACTIVE">ACTIVE（出品中）</option>
        </select>
      </label>
      <label>
        マーケット
        <select id="marketplace">
          <option value="EBAY-US">eBay US</option>
          <option value="EBAY-GB">eBay UK</option>
          <option value="EBAY-DE">eBay DE</option>
          <option value="EBAY-AU">eBay AU</option>
          <option value="EBAY-CA">eBay CA</option>
          <option value="EBAY-FR">eBay FR</option>
          <option value="EBAY-IT">eBay IT</option>
          <option value="EBAY-ES">eBay ES</option>
        </select>
      </label>
      <label>
        出品者の国
        <select id="sellerCountry">
          <option value="">指定なし</option>
          <option value="JP" selected>日本 (JP)</option>
          <option value="US">アメリカ (US)</option>
          <option value="GB">イギリス (GB)</option>
          <option value="DE">ドイツ (DE)</option>
          <option value="CN">中国 (CN)</option>
          <option value="HK">香港 (HK)</option>
          <option value="AU">オーストラリア (AU)</option>
          <option value="CA">カナダ (CA)</option>
          <option value="FR">フランス (FR)</option>
          <option value="IT">イタリア (IT)</option>
        </select>
      </label>
      <label>
        並び替え
        <select id="sorting">
          <option value="-itemssold">売れ数（多い順）</option>
          <option value="itemssold">売れ数（少ない順）</option>
          <option value="-soldprice">価格（高い順）</option>
          <option value="soldprice">価格（低い順）</option>
          <option value="-enddate">終了日（新しい順）</option>
          <option value="enddate">終了日（古い順）</option>
        </select>
      </label>
    </div>

    <!-- 価格 + カテゴリ -->
    <div class="g3" style="margin-bottom:10px">
      <label>最低価格 ($)<input type="number" id="minPrice" value="50" min="0"></label>
      <label>最高価格 ($)<input type="number" id="maxPrice" value="200" min="0"></label>
      <label>
        カテゴリ
        <select id="categorySelect" onchange="generateUrl()">
          <optgroup label="── すべて ──">
            <option value="0" selected>すべてのカテゴリ (0)</option>
          </optgroup>
          <optgroup label="トップレベル">
            <option value="20081">アンティーク (20081)</option>
            <option value="550">アート (550)</option>
            <option value="2984">ベビー用品 (2984)</option>
            <option value="267">本 (267)</option>
            <option value="12576">ビジネス・産業用品 (12576)</option>
            <option value="625">カメラ・写真 (625)</option>
            <option value="15032">携帯電話・アクセサリー (15032)</option>
            <option value="11450">ファッション (11450)</option>
            <option value="11116">コイン・紙幣 (11116)</option>
            <option value="1">コレクタブル (1)</option>
            <option value="58058">パソコン・タブレット (58058)</option>
            <option value="293">家電 (293)</option>
            <option value="14339">クラフト (14339)</option>
            <option value="237">人形・ぬいぐるみ (237)</option>
            <option value="11232">DVD・映画 (11232)</option>
            <option value="26395">美容・健康 (26395)</option>
            <option value="11700">ホーム・ガーデン (11700)</option>
            <option value="281">ジュエリー・時計 (281)</option>
            <option value="11233">音楽 (11233)</option>
            <option value="619">楽器 (619)</option>
            <option value="1281">ペット用品 (1281)</option>
            <option value="870">陶磁器・ガラス (870)</option>
            <option value="888">スポーツ用品 (888)</option>
            <option value="260">切手 (260)</option>
            <option value="220">おもちゃ・ホビー (220)</option>
            <option value="1249">ビデオゲーム・コンソール (1249)</option>
            <option value="99">その他 (99)</option>
          </optgroup>
          <optgroup label="カメラ・写真">
            <option value="15052">カメラレンズ (15052)</option>
            <option value="31388">デジタルカメラ (31388)</option>
            <option value="80822">フィルムカメラ (80822)</option>
          </optgroup>
          <optgroup label="家電">
            <option value="3836">ポータブルオーディオ (3836)</option>
            <option value="14969">TV・映像・音響 (14969)</option>
          </optgroup>
          <optgroup label="パソコン・タブレット">
            <option value="175672">ノートパソコン (175672)</option>
            <option value="171485">タブレット (171485)</option>
          </optgroup>
          <optgroup label="コレクタブル">
            <option value="45100">エンタメ記念品 (45100)</option>
            <option value="2536">アニメーションアート (2536)</option>
          </optgroup>
          <optgroup label="おもちゃ・ホビー">
            <option value="64482">アクションフィギュア (64482)</option>
            <option value="183050">トレーディングカードゲーム (183050)</option>
            <option value="261068">ポケモン TCG (261068)</option>
            <option value="38583">ノンスポーツ トレカ (38583)</option>
            <option value="2562">ミニカー・ダイキャスト (2562)</option>
          </optgroup>
          <optgroup label="スポーツ">
            <option value="182150">スポーツ トレカ (182150)</option>
            <option value="3226">スポーツメモラビリア (3226)</option>
          </optgroup>
          <optgroup label="ビデオゲーム">
            <option value="139973">Nintendo Switch (139973)</option>
            <option value="146170">PlayStation 4 (146170)</option>
            <option value="156955">PlayStation 5 (156955)</option>
            <option value="139971">Nintendo 3DS (139971)</option>
          </optgroup>
          <optgroup label="音楽">
            <option value="306">CD (306)</option>
            <option value="309">レコード・ビニール (309)</option>
            <option value="41511">カセットテープ (41511)</option>
          </optgroup>
          <optgroup label="本">
            <option value="68183">コミック・グラフィックノベル (68183)</option>
            <option value="29223">アンティーク・コレクタブル本 (29223)</option>
          </optgroup>
          <optgroup label="ジュエリー・時計">
            <option value="31387">腕時計 (31387)</option>
            <option value="164">ファインジュエリー (164)</option>
            <option value="10968">ファッションジュエリー (10968)</option>
          </optgroup>
          <optgroup label="ファッション">
            <option value="1059">メンズ衣類 (1059)</option>
            <option value="15724">レディース衣類 (15724)</option>
            <option value="63889">メンズシューズ (63889)</option>
            <option value="3034">レディースシューズ (3034)</option>
            <option value="169291">バッグ・財布 (169291)</option>
          </optgroup>
          <optgroup label="スポーツ用品">
            <option value="7294">フィッシング (7294)</option>
            <option value="1513">ゴルフ (1513)</option>
            <option value="76942">サイクリング (76942)</option>
          </optgroup>
          <optgroup label="ホーム・ガーデン">
            <option value="11104">家具 (11104)</option>
            <option value="20444">キッチン・ダイニング (20444)</option>
          </optgroup>
          <optgroup label="楽器">
            <option value="33034">ギター (33034)</option>
            <option value="16221">キーボード・ピアノ (16221)</option>
            <option value="180014">ドラム (180014)</option>
          </optgroup>
          <optgroup label="アート">
            <option value="36045">絵画 (36045)</option>
            <option value="10696">版画・エディション (10696)</option>
          </optgroup>
          <optgroup label="ビジネス・産業用品">
            <option value="26230">オフィス用品 (26230)</option>
            <option value="11804">医療・ラボ用品 (11804)</option>
          </optgroup>
        </select>
      </label>
    </div>

    <!-- コンディション -->
    <div class="field-label">コンディション <span style="font-size:0.7rem">（未選択 = 指定なし）</span></div>
    <div class="checkbox-group" id="conditionGroup">
      <label class="cond-item"><input type="checkbox" value="1000" onchange="generateUrl()"> 新品</label>
      <label class="cond-item"><input type="checkbox" value="1500" onchange="generateUrl()"> 新品・その他</label>
      <label class="cond-item"><input type="checkbox" value="1750" onchange="generateUrl()"> 新品・難あり</label>
      <label class="cond-item"><input type="checkbox" value="2500" onchange="generateUrl()"> 再生品</label>
      <label class="cond-item"><input type="checkbox" value="3000" onchange="generateUrl()"> 中古品</label>
      <label class="cond-item"><input type="checkbox" value="7000" onchange="generateUrl()"> ジャンク</label>
    </div>

    <!-- 詳細設定 -->
    <details class="adv">
      <summary>詳細設定（offset / 表示件数 / タイムゾーン）</summary>
      <div class="adv-body">
        <div class="g3">
          <label>開始位置 (offset)<input type="number" id="offset" value="0" min="0" step="50"></label>
          <label>
            表示件数 (limit)
            <select id="limit">
              <option value="25">25件</option>
              <option value="50" selected>50件</option>
              <option value="100">100件</option>
              <option value="200">200件</option>
            </select>
          </label>
          <label>
            タイムゾーン
            <select id="tz">
              <option value="Asia/Tokyo" selected>Asia/Tokyo</option>
              <option value="America/New_York">America/New_York</option>
              <option value="America/Los_Angeles">America/Los_Angeles</option>
              <option value="Europe/London">Europe/London</option>
              <option value="Europe/Berlin">Europe/Berlin</option>
            </select>
          </label>
        </div>
      </div>
    </details>
  </div>

  <!-- ③ プリセット -->
  <div class="card">
    <div class="card-title">プリセット保存 <span id="presetCount" style="font-weight:400;color:var(--text-muted)"></span></div>
    <div class="preset-save-row">
      <input type="text" id="presetName" placeholder="プリセット名を入力（例: JP出品者 ポケカ除外）" maxlength="30">
      <button type="button" class="btn btn-open" style="padding:8px 18px;font-size:0.84rem" onclick="savePreset()">保存</button>
    </div>
    <div id="presetList" class="preset-list"></div>
  </div>

</div>

<!-- Sticky URL bar -->
<div class="url-bar">
  <div class="url-bar-inner">
    <div class="url-display" id="urlOutput">（URLがここに表示されます）</div>
    <div class="url-btns">
      <button type="button" class="btn btn-copy" id="copyBtn" onclick="copyUrl()">コピー</button>
      <button type="button" class="btn btn-open" onclick="openUrl()">eBay で開く</button>
    </div>
  </div>
</div>

<script>
  // --- Tag inputs ---
  const excludeTags = [];

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // --- 除外キーワード タグ入力 ---
  const excludeWrap = document.getElementById('excludeWrap');
  const excludeInput = document.getElementById('excludeInput');
  excludeWrap.addEventListener('click', () => excludeInput.focus());
  excludeInput.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ',') && excludeInput.value.trim()) {
      e.preventDefault();
      addExcludeTag(excludeInput.value.trim());
    } else if (e.key === 'Backspace' && !excludeInput.value && excludeTags.length) {
      removeExcludeTag(excludeTags.length - 1);
    }
  });

  function addExcludeTag(val) {
    if (excludeTags.includes(val)) { excludeInput.value = ''; return; }
    excludeTags.push(val);
    const span = document.createElement('span');
    span.className = 'tag exclude';
    span.innerHTML = `${escHtml(val)}<button type="button" onclick="removeExcludeByVal('${escHtml(val)}')">×</button>`;
    excludeWrap.insertBefore(span, excludeInput);
    excludeInput.value = '';
    generateUrl();
  }

  function removeExcludeByVal(val) {
    const idx = excludeTags.indexOf(val);
    if (idx !== -1) removeExcludeTag(idx);
  }

  function removeExcludeTag(idx) {
    excludeTags.splice(idx, 1);
    [...excludeWrap.querySelectorAll('.tag')].forEach(el => el.remove());
    excludeTags.forEach(val => {
      const span = document.createElement('span');
      span.className = 'tag exclude';
      span.innerHTML = `${escHtml(val)}<button type="button" onclick="removeExcludeByVal('${escHtml(val)}')">×</button>`;
      excludeWrap.insertBefore(span, excludeInput);
    });
    generateUrl();
  }

  // --- Date mode toggle ---
  document.querySelectorAll('input[name="dateMode"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const preset = radio.value === 'preset';
      document.getElementById('dateRangeSection').classList.toggle('show', preset);
      document.getElementById('customDateSection').classList.toggle('show', !preset);
      document.getElementById('modePreset').classList.toggle('active', preset);
      document.getElementById('modeCustom').classList.toggle('active', !preset);
      generateUrl();
    });
  });

  // Default: today as endDate, 7 days ago as startDate
  (() => {
    const today = new Date();
    const past = new Date(today); past.setDate(past.getDate() - 7);
    document.getElementById('endDate').value = fmtDate(today);
    document.getElementById('startDate').value = fmtDate(past);
  })();

  function fmtDate(d) {
    return d.toISOString().slice(0, 10);
  }

  // Auto-generate on any input change
  document.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', generateUrl);
    el.addEventListener('change', generateUrl);
  });

  // --- URL generation ---
  let currentUrl = '';

  function generateUrl() {
    const marketplace = document.getElementById('marketplace').value;
    const tabName = document.getElementById('tabName').value;
    const dayRangeVal = parseInt(document.getElementById('dayRange').value) || 7;
    const minPrice = document.getElementById('minPrice').value;
    const maxPrice = document.getElementById('maxPrice').value;
    const categoryId = document.getElementById('categorySelect').value || '0';
    const sorting = document.getElementById('sorting').value;
    const sellerCountry = document.getElementById('sellerCountry').value;
    const tz = document.getElementById('tz').value;
    const mode = document.querySelector('input[name="dateMode"]:checked').value;

    // Keywords
    const includeRaw = document.getElementById('includeInput').value.trim();
    const kwParts = [];
    if (includeRaw) {
      kwParts.push(includeRaw);
    } else {
      kwParts.push('""');
    }
    excludeTags.forEach(k => kwParts.push(`-${k}`));
    const keywords = kwParts.join(' ');

    // Dates
    let startMs, endMs, dayRange;
    if (mode === 'preset') {
      dayRange = dayRangeVal;
      const now = new Date();
      endMs = dayStartMs(now, tz);
      const start = new Date(now); start.setDate(start.getDate() - dayRangeVal);
      startMs = dayStartMs(start, tz);
    } else {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (!s || !e) { document.getElementById('urlOutput').textContent = '⚠ 開始日と終了日を入力してください'; return; }
      startMs = new Date(s + 'T00:00:00').getTime();
      endMs   = new Date(e + 'T00:00:00').getTime();
      dayRange = Math.round((endMs - startMs) / 86400000);
    }

    const params = new URLSearchParams();
    params.set('marketplace', marketplace);
    params.set('keywords', keywords);
    params.set('dayRange', dayRange);
    params.set('endDate', endMs);
    params.set('startDate', startMs);
    params.set('categoryId', categoryId);
    if (minPrice !== '') params.set('minPrice', minPrice);
    if (maxPrice !== '') params.set('maxPrice', maxPrice);
    if (sellerCountry) params.set('sellerCountry', `SellerLocation:::${sellerCountry}`);
    const conditionIds = [...document.querySelectorAll('#conditionGroup input:checked')].map(el => el.value);
    conditionIds.forEach(id => params.append('conditionId', id));
    params.set('offset', document.getElementById('offset').value || '0');
    params.set('limit', document.getElementById('limit').value || '50');
    params.set('sorting', sorting);
    params.set('tabName', tabName);
    params.set('tz', tz);

    currentUrl = `https://www.ebay.com/sh/research?${params.toString()}`;
    document.getElementById('urlOutput').textContent = currentUrl;
  }

  function dayStartMs(date, tz) {
    const d = new Date(date.toISOString().slice(0,10) + 'T00:00:00Z');
    return d.getTime();
  }

  function copyUrl() {
    if (!currentUrl) return;
    navigator.clipboard.writeText(currentUrl).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'コピー済み ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 1800);
    });
  }

  function openUrl() {
    if (!currentUrl) { generateUrl(); }
    if (currentUrl) window.open(currentUrl, '_blank');
  }

  // --- プリセット ---
  const PRESET_KEY = 'terapeak_presets';
  const MAX_PRESETS = 10;

  function loadPresets() {
    try { return JSON.parse(localStorage.getItem(PRESET_KEY)) || []; }
    catch { return []; }
  }

  function savePresetsToStorage(presets) {
    localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
  }

  function collectSettings() {
    return {
      includeInput:   document.getElementById('includeInput').value,
      excludeTags:    [...excludeTags],
      dateMode:       document.querySelector('input[name="dateMode"]:checked').value,
      dayRange:       document.getElementById('dayRange').value,
      startDate:      document.getElementById('startDate').value,
      endDate:        document.getElementById('endDate').value,
      minPrice:       document.getElementById('minPrice').value,
      maxPrice:       document.getElementById('maxPrice').value,
      tabName:        document.getElementById('tabName').value,
      marketplace:    document.getElementById('marketplace').value,
      sellerCountry:  document.getElementById('sellerCountry').value,
      sorting:        document.getElementById('sorting').value,
      categoryId:    document.getElementById('categorySelect').value || '0',
      offset:         document.getElementById('offset').value,
      limit:          document.getElementById('limit').value,
      tz:             document.getElementById('tz').value,
      conditionIds:   [...document.querySelectorAll('#conditionGroup input:checked')].map(el => el.value),
    };
  }

  function applySettings(s) {
    document.getElementById('includeInput').value = s.includeInput || '';

    // 除外タグ復元
    excludeTags.length = 0;
    [...excludeWrap.querySelectorAll('.tag')].forEach(el => el.remove());
    (s.excludeTags || []).forEach(v => addExcludeTag(v));

    // 期間モード
    const preset = s.dateMode !== 'custom';
    document.querySelector(`input[name="dateMode"][value="${s.dateMode || 'preset'}"]`).checked = true;
    document.getElementById('dateRangeSection').classList.toggle('show', preset);
    document.getElementById('customDateSection').classList.toggle('show', !preset);
    document.getElementById('modePreset').classList.toggle('active', preset);
    document.getElementById('modeCustom').classList.toggle('active', !preset);

    document.getElementById('dayRange').value       = s.dayRange || '7';
    document.getElementById('startDate').value      = s.startDate || '';
    document.getElementById('endDate').value        = s.endDate || '';
    document.getElementById('minPrice').value       = s.minPrice ?? '50';
    document.getElementById('maxPrice').value       = s.maxPrice ?? '200';
    document.getElementById('tabName').value        = s.tabName || 'SOLD';
    document.getElementById('marketplace').value    = s.marketplace || 'EBAY-US';
    document.getElementById('sellerCountry').value  = s.sellerCountry || 'JP';
    document.getElementById('sorting').value        = s.sorting || '-itemssold';
    document.getElementById('categorySelect').value = s.categoryId || '0';
    document.getElementById('offset').value         = s.offset || '0';
    document.getElementById('limit').value          = s.limit || '50';
    document.getElementById('tz').value             = s.tz || 'Asia/Tokyo';
    document.querySelectorAll('#conditionGroup input').forEach(cb => {
      cb.checked = (s.conditionIds || []).includes(cb.value);
    });

    generateUrl();
  }

  function savePreset() {
    const name = document.getElementById('presetName').value.trim();
    if (!name) {
      const input = document.getElementById('presetName');
      input.focus();
      input.style.borderColor = '#e11d48';
      setTimeout(() => { input.style.borderColor = ''; }, 1500);
      return;
    }
    const presets = loadPresets();
    if (presets.length >= MAX_PRESETS) {
      alert(`保存できるプリセットは最大 ${MAX_PRESETS} 個です。\n不要なプリセットを削除してから保存してください。`);
      return;
    }
    presets.push({ name, settings: collectSettings(), snapshotUrl: currentUrl, savedAt: Date.now() });
    savePresetsToStorage(presets);
    document.getElementById('presetName').value = '';
    renderPresetList();
  }

  function openPresetToday(idx) {
    const presets = loadPresets();
    if (!presets[idx]) return;
    applySettings({ ...presets[idx].settings, dateMode: 'preset' });
    if (currentUrl) window.open(currentUrl, '_blank');
  }

  function copyPresetUrl(idx, btn) {
    const presets = loadPresets();
    const url = presets[idx]?.snapshotUrl;
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
      const orig = btn.textContent;
      btn.textContent = '✓';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  }

  function applyPreset(idx) {
    const presets = loadPresets();
    if (presets[idx]) applySettings(presets[idx].settings);
  }

  function deletePreset(idx) {
    const presets = loadPresets();
    presets.splice(idx, 1);
    savePresetsToStorage(presets);
    renderPresetList();
  }

  function renderPresetList() {
    const presets = loadPresets();
    const list = document.getElementById('presetList');
    const count = document.getElementById('presetCount');
    count.textContent = `${presets.length} / ${MAX_PRESETS}`;

    if (!presets.length) {
      list.innerHTML = '<div class="preset-empty">保存済みプリセットはありません</div>';
      return;
    }

    list.innerHTML = presets.map((p, i) => {
      const d = new Date(p.savedAt);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const urlPreview = p.snapshotUrl ? escHtml(p.snapshotUrl) : '';
      const urlRow = p.snapshotUrl ? `
        <div class="preset-url-row">
          <span class="preset-url-text" title="${urlPreview}">${urlPreview}</span>
          <button class="preset-btn" style="padding:2px 7px;font-size:0.7rem" onclick="copyPresetUrl(${i}, this)">コピー</button>
        </div>` : '';
      return `<div class="preset-item">
        <div class="preset-header">
          <span class="preset-num">${i+1}</span>
          <span class="preset-name" title="${escHtml(p.name)}">${escHtml(p.name)}</span>
          <span class="preset-date">${dateStr}</span>
        </div>
        ${urlRow}
        <div class="preset-actions">
          <button class="preset-btn primary" onclick="openPresetToday(${i})">今日で開く</button>
          <button class="preset-btn" onclick="applyPreset(${i})">設定読込</button>
          <button class="preset-btn del" onclick="deletePreset(${i})">削除</button>
        </div>
      </div>`;
    }).join('');
  }

  // Init
  renderPresetList();
  generateUrl();
</script>
</body>
</html>
